name: Deploy Azure Function App (func-vitals-extractor-dev)

on:
  push:
    branches:
      - main
    paths:
      - 'azure_function/**'
      - 'backend/**'
      - '.github/workflows/deploy_azure_function.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'func-vitals-extractor-dev'
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 'Install Dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -r azure_function/requirements.txt --target="./deploy_package/.python_packages/lib/site-packages"

      - name: 'Prepare Function Artifact'
        run: |
          mkdir -p deploy_package
          cp azure_function/function_app.py deploy_package/
          cp azure_function/host.json deploy_package/
          cp azure_function/requirements.txt deploy_package/
          cp -r backend deploy_package/

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: './deploy_package'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

